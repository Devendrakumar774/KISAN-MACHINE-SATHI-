<body

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(
          (reg) => console.log('Kisan ServiceWorker registered with scope: ', reg.scope),
          (err) => console.log('Kisan ServiceWorker registration failed: ', err)
        );
      });
    }
  </script>
